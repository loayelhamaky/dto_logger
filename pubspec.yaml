name: dto_logger
description: Debug-only logging and safe type coercion for JSON DTOs in Flutter/Dart. Generate classes from JSON, see nulls, missing keys, type mismatches and unused fields per model.
version: 1.1.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Code generation (@DtoLog). Wide analyzer range on purpose: older Flutter
  # projects resolve analyzer 5.13. See README "Dependencies".
  build: ^2.3.0
  source_gen: ^1.5.0
  analyzer: ">=5.13.0 <8.0.0"

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.24.0
  lints: ^3.0.0
